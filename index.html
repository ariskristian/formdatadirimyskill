<!DOCTYPE html>
<html lang="id">
<head>

    <title>Form Data Diri</title>

</head>
<body>

        <h1>Form Data Diri</h1>

        </form>

        <div id="hasil"></div>

    </div>

    <script src="script.js"></script>
